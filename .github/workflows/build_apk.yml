name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Secrets & Debug Keystore
        run: |
          # Create .env from template if missing
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          
          # Restore debug.keystore from base64 if present
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          
          # If still missing, generate a default android debug keystore
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC" \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.workers.max=2 \
            -Djava.awt.headless=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DokanKhata-App-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
